name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------
  # 1. 代码质量：格式 + 静态检查（不装重依赖，快速反馈）
  # ----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Ruff check
        run: ruff check src scripts --output-format=github

      - name: Black format check
        run: black --check src scripts

  # ----------------------------------------------------------
  # 2. 纯逻辑验证（零依赖，作为最低保障门禁）
  # ----------------------------------------------------------
  verify-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"

      - name: Run pure-logic verify
        run: python scripts/verify_pure.py

  # ----------------------------------------------------------
  # 3. 完整验证：装依赖后跑 LangGraph mock 全流程
  # ----------------------------------------------------------
  verify-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/python-setup
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install langgraph langchain-core

      - name: Run full verify
        run: python scripts/verify.py

      - name: Run evaluation (offline)
        run: python scripts/evaluate.py

  # ----------------------------------------------------------
  # 4. Docker 构建（确保镜像始终可构建）
  # ----------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: [verify-pure]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Run verify in container
        run: docker compose run --rm verify

  # ----------------------------------------------------------
  # 汇总：所有门禁通过才算绿
  # ----------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    needs: [lint, verify-pure, verify-full, docker]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "verify-pure=${{ needs.verify-pure.result }}"
          echo "verify-full=${{ needs.verify-full.result }}"
          echo "docker=${{ needs.docker.result }}"
          for job in "${{ needs.lint.result }}" "${{ needs.verify-pure.result }}" \
                      "${{ needs.verify-full.result }}" "${{ needs.docker.result }}"; do
            [ "$job" = "success" ] || (echo "❌ 有门禁未通过: $job"; exit 1)
          done
          echo "✅ 所有 CI 门禁通过"
