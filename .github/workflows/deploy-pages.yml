# ----------------------------------------------------------
# 文档站部署：MkDocs Material → GitHub Pages
#
# 触发：push 到 main / master，或手动触发（Actions 页 Run workflow）
# 产物：gh-pages 部署物，访问 https://jiashaoying.github.io/langstack-demo/
#
# 注意：首次使用需在仓库 Settings → Pages 中把 Source 设为
#       "GitHub Actions"（Deploy from a branch 无法使用本工作流）。
# ----------------------------------------------------------
name: Deploy Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# 官方 Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
